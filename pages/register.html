<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản – LawTANT</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .step-bar { display:flex; gap:0; margin-bottom:2rem; }
    .step { flex:1; text-align:center; font-size:0.75rem; color:var(--text-muted); position:relative; }
    .step::before { content:''; display:block; width:28px; height:28px; border-radius:50%; border:2px solid var(--border); background:var(--bg2); margin:0 auto 6px; line-height:24px; font-weight:700; font-size:0.8rem; }
    .step.done::before { background:#10b981; border-color:#10b981; content:'✓'; color:#fff; }
    .step.active::before { background:linear-gradient(135deg,#c8960c,#f0c040); border-color:#c8960c; content:attr(data-n); color:#0a0f1e; }
    .step::after { content:''; position:absolute; top:14px; left:calc(50% + 14px); right:calc(-50% + 14px); height:2px; background:var(--border); }
    .step:last-child::after { display:none; }
    .step.done::after { background:#10b981; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .strength-bar { height:4px; border-radius:100px; margin-top:6px; background:rgba(255,255,255,0.08); overflow:hidden; }
    .strength-fill { height:100%; border-radius:100px; transition:width 0.3s, background 0.3s; }
    .strength-label { font-size:0.72rem; margin-top:3px; }
    .check-item { display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--text-muted); margin-top:4px; }
    .check-item.ok { color:#6ee7b7; }
    @media(max-width:500px) { .field-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">⚖</div>
        <div class="logo-text"><span class="logo-main">LawTANT</span><span class="logo-sub">HVHCQTC</span></div>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline">Đã có tài khoản? Đăng nhập</a>
      </div>
    </div>
  </nav>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6rem 1rem 2rem;position:relative;overflow:hidden;">
    <div class="hero-bg" style="position:fixed;inset:0;z-index:0;">
      <div class="hero-orb hero-orb-1"></div>
      <div class="hero-orb hero-orb-2"></div>
      <div class="hero-grid"></div>
    </div>

    <div style="position:relative;z-index:1;width:100%;max-width:520px;">
      <!-- Step bar -->
      <div class="step-bar">
        <div class="step active" data-n="1" id="step1El">Chọn vai trò</div>
        <div class="step" data-n="2" id="step2El">Thông tin cá nhân</div>
        <div class="step" data-n="3" id="step3El">Đặt mật khẩu</div>
      </div>

      <div class="login-card">
        <div style="text-align:center;margin-bottom:1.5rem;">
          <div style="font-size:2rem;margin-bottom:0.5rem;">📝</div>
          <h2>Tạo tài khoản mới</h2>
          <p class="subtitle" id="stepSubtitle">Bước 1: Chọn vai trò của bạn</p>
        </div>

        <!-- Step 1: Role -->
        <div id="formStep1">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;">
            <div id="roleCardSV" onclick="selectRole('student')" style="border:2px solid rgba(79,70,229,0.3);border-radius:14px;padding:1.5rem;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(79,70,229,0.06);">
              <div style="font-size:2.5rem;margin-bottom:0.5rem;">👨‍🎓</div>
              <div style="font-weight:700;color:#fff;font-size:0.95rem;">Sinh viên</div>
              <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">Học tập & đồng kiến tạo</div>
            </div>
            <div id="roleCardGV" onclick="selectRole('lecturer')" style="border:2px solid rgba(200,150,12,0.2);border-radius:14px;padding:1.5rem;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(200,150,12,0.04);">
              <div style="font-size:2.5rem;margin-bottom:0.5rem;">👨‍🏫</div>
              <div style="font-weight:700;color:#fff;font-size:0.95rem;">Giảng viên</div>
              <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">Quản lý & hướng dẫn</div>
            </div>
          </div>
          <button class="login-btn" id="btnStep1" onclick="goStep(2)" disabled>Tiếp theo →</button>
        </div>

        <!-- Step 2: Personal info -->
        <div id="formStep2" style="display:none;">
          <div class="form-group">
            <label>Họ và tên đầy đủ <span style="color:#fca5a5;">*</span></label>
            <input type="text" id="regName" placeholder="VD: Nguyễn Văn An" required />
          </div>
          <div class="field-row">
            <div class="form-group">
              <label id="regIdLabel">Mã sinh viên <span style="color:#fca5a5;">*</span></label>
              <input type="text" id="regId" placeholder="VD: sv2025003" required oninput="checkIdLive()" />
              <span id="idMsg" style="font-size:0.75rem;margin-top:3px;display:block;"></span>
            </div>
            <div class="form-group">
              <label id="regClassLabel">Lớp / Khoa <span style="color:#fca5a5;">*</span></label>
              <input type="text" id="regClass" placeholder="VD: K47-Luật HC" required />
            </div>
          </div>
          <div class="form-group">
            <label>Email <span style="color:#fca5a5;">*</span></label>
            <input type="email" id="regEmail" placeholder="email@HVHCQTC.edu.vn" required />
          </div>
          <div id="step2ErrMsg" style="display:none;color:#fca5a5;font-size:0.82rem;padding:0.5rem 0.75rem;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:8px;margin-top:0.5rem;"></div>
          <div style="display:flex;gap:0.75rem;margin-top:0.75rem;">
            <button class="btn btn-outline" onclick="goStep(1)" style="flex:1;">← Quay lại</button>
            <button class="login-btn" onclick="goStep(3)" style="flex:2;margin-top:0;">Tiếp theo →</button>
          </div>
        </div>

        <!-- Step 3: Password -->
        <div id="formStep3" style="display:none;">
          <div class="form-group">
            <label>Mật khẩu <span style="color:#fca5a5;">*</span></label>
            <div style="position:relative;">
              <input type="password" id="regPw" placeholder="Tối thiểu 6 ký tự..." oninput="checkStrength()" style="padding-right:3rem;" />
              <button type="button" onclick="togglePw('regPw')" style="position:absolute;right:0.8rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">👁</button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%;"></div></div>
            <span class="strength-label" id="strengthLabel" style="color:var(--text-muted);">Nhập mật khẩu...</span>
            <div id="pwChecks" style="margin-top:6px;display:flex;flex-direction:column;gap:2px;">
              <div class="check-item" id="chk6">○ Ít nhất 6 ký tự</div>
              <div class="check-item" id="chkNum">○ Chứa ít nhất 1 chữ số</div>
            </div>
          </div>
          <div class="form-group">
            <label>Xác nhận mật khẩu <span style="color:#fca5a5;">*</span></label>
            <input type="password" id="regPwConfirm" placeholder="Nhập lại mật khẩu..." oninput="checkConfirm()" />
            <span id="confirmMsg" style="font-size:0.75rem;margin-top:3px;display:block;"></span>
          </div>

          <div id="regMsg" style="display:none;margin-bottom:1rem;padding:0.7rem;border-radius:8px;font-size:0.85rem;"></div>

          <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
            <button class="btn btn-outline" onclick="goStep(2)" style="flex:1;">← Quay lại</button>
            <button class="login-btn" onclick="handleRegister()" style="flex:2;margin-top:0;" id="btnRegister">Tạo tài khoản</button>
          </div>
        </div>

        <div class="login-switch" style="margin-top:1.2rem;">
          Đã có tài khoản? <a href="login.html" style="color:#f0c040;font-weight:600;">Đăng nhập</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/cloud-db.js"></script>
  <script>
    let selectedRole = null;
    const subtitles = ['', 'Bước 1: Chọn vai trò', 'Bước 2: Thông tin cá nhân', 'Bước 3: Đặt mật khẩu'];

    function selectRole(role) {
      selectedRole = role;
      const isSV = role === 'student';
      document.getElementById('roleCardSV').style.borderColor = isSV ? '#818cf8' : 'rgba(79,70,229,0.3)';
      document.getElementById('roleCardSV').style.background = isSV ? 'rgba(79,70,229,0.15)' : 'rgba(79,70,229,0.06)';
      document.getElementById('roleCardGV').style.borderColor = !isSV ? '#f0c040' : 'rgba(200,150,12,0.2)';
      document.getElementById('roleCardGV').style.background = !isSV ? 'rgba(200,150,12,0.12)' : 'rgba(200,150,12,0.04)';
      document.getElementById('btnStep1').disabled = false;
    }

    function showStep2Error(msg) {
      // Hiển thị lỗi trong step 2 nếu đang ở bước 3
      const el = document.getElementById('step2ErrMsg');
      if (el) { el.style.display='block'; el.textContent = msg; }
    }

    function checkIdLive() {
      const id = document.getElementById('regId').value.trim();
      const idMsg = document.getElementById('idMsg');
      if (!id) { idMsg.textContent = ''; document.getElementById('regId').style.borderColor = ''; return; }
      const users = Auth.getUsers();
      if (users.find(u => u.id === id)) {
        idMsg.textContent = '✗ Mã số này đã tồn tại, hãy dùng mã khác.';
        idMsg.style.color = '#fca5a5';
        document.getElementById('regId').style.borderColor = 'rgba(239,68,68,0.5)';
      } else {
        idMsg.textContent = '✓ Mã số hợp lệ';
        idMsg.style.color = '#6ee7b7';
        document.getElementById('regId').style.borderColor = 'rgba(16,185,129,0.4)';
      }
    }

    function goStep(n) {
      if (n === 2) {
        // Validate step 1
        if (!selectedRole) { alert('Vui lòng chọn vai trò!'); return; }
        // Update labels for role
        const isGV = selectedRole === 'lecturer';
        document.getElementById('regIdLabel').textContent = isGV ? 'Email đăng nhập *' : 'Mã sinh viên *';
        document.getElementById('regClassLabel').textContent = isGV ? 'Khoa/Bộ môn *' : 'Lớp học *';
        document.getElementById('regId').placeholder = isGV ? 'email@HVHCQTC.edu.vn' : 'sv2025001';
        document.getElementById('regClass').placeholder = isGV ? 'VD: Khoa Luật' : 'VD: K47-Luật HC';
      }
      if (n === 3) {
        // Validate step 2
        const name = document.getElementById('regName').value.trim();
        const id = document.getElementById('regId').value.trim();
        const cls = document.getElementById('regClass').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        if (!name || !id || !cls || !email) {
          showStep2Error('Vui lòng điền đầy đủ thông tin!');
          return;
        }
        if (!/\S+@\S+\.\S+/.test(email)) {
          showStep2Error('⚠ Email không hợp lệ.');
          return;
        }
        // Kiểm tra ID trùng NGAY TẠI BƯỚC 2
        const users = Auth.getUsers();
        if (users.find(u => u.id === id)) {
          const idMsg = document.getElementById('idMsg');
          idMsg.textContent = '✗ Mã số này đã được đăng ký. Hãy dùng mã số khác.';
          idMsg.style.color = '#fca5a5';
          document.getElementById('regId').style.borderColor = 'rgba(239,68,68,0.5)';
          document.getElementById('regId').focus();
          return; // Giữ ở bước 2, không chuyển sang bước 3
        }
        if (email && users.find(u => u.email === email)) {
          showStep2Error('⚠ Email này đã được sử dụng bởi tài khoản khác.');
          return;
        }
      }

      [1,2,3].forEach(i => {
        document.getElementById('formStep'+i).style.display = i === n ? 'block' : 'none';
        const el = document.getElementById('step'+i+'El');
        el.classList.toggle('active', i === n);
        el.classList.toggle('done', i < n);
      });
      document.getElementById('stepSubtitle').textContent = subtitles[n];
    }

    function checkStrength() {
      const pw = document.getElementById('regPw').value;
      const has6 = pw.length >= 6;
      const hasNum = /\d/.test(pw);
      document.getElementById('chk6').className = 'check-item' + (has6 ? ' ok' : '');
      document.getElementById('chk6').textContent = (has6 ? '✓' : '○') + ' Ít nhất 6 ký tự';
      document.getElementById('chkNum').className = 'check-item' + (hasNum ? ' ok' : '');
      document.getElementById('chkNum').textContent = (hasNum ? '✓' : '○') + ' Chứa ít nhất 1 chữ số';
      const score = (has6 ? 1 : 0) + (hasNum ? 1 : 0) + (pw.length >= 10 ? 1 : 0);
      const colors = ['', '#ef4444', '#f59e0b', '#10b981'];
      const labels = ['', 'Yếu', 'Trung bình', 'Mạnh'];
      document.getElementById('strengthFill').style.width = (score * 33) + '%';
      document.getElementById('strengthFill').style.background = colors[score] || '#c8960c';
      document.getElementById('strengthLabel').textContent = score ? 'Mật khẩu: ' + labels[score] : '';
      document.getElementById('strengthLabel').style.color = colors[score] || 'var(--text-muted)';
    }

    function checkConfirm() {
      const pw = document.getElementById('regPw').value;
      const c = document.getElementById('regPwConfirm').value;
      const msg = document.getElementById('confirmMsg');
      if (!c) { msg.textContent = ''; return; }
      msg.textContent = pw === c ? '✓ Mật khẩu khớp' : '✗ Mật khẩu không khớp';
      msg.style.color = pw === c ? '#6ee7b7' : '#fca5a5';
    }

    function togglePw(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function showMsg(id, success, text) {
      const el = document.getElementById(id);
      el.style.display = 'block';
      el.style.background = success ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)';
      el.style.border = success ? '1px solid rgba(16,185,129,0.3)' : '1px solid rgba(239,68,68,0.3)';
      el.style.color = success ? '#6ee7b7' : '#fca5a5';
      el.textContent = text;
    }

    function handleRegister() {
      const pw = document.getElementById('regPw').value;
      const pwc = document.getElementById('regPwConfirm').value;
      if (pw.length < 6) { showMsg('regMsg', false, '✗ Mật khẩu phải có ít nhất 6 ký tự.'); return; }
      if (pw !== pwc) { showMsg('regMsg', false, '✗ Mật khẩu xác nhận không khớp.'); return; }

      const btn = document.getElementById('btnRegister');
      btn.textContent = 'Đang tạo tài khoản...';
      btn.disabled = true;

      const isGV = selectedRole === 'lecturer';
      const idVal = document.getElementById('regId').value.trim();

      setTimeout(() => {
        const result = Auth.register({
          id: idVal,
          password: pw,
          role: selectedRole,
          name: document.getElementById('regName').value.trim(),
          email: document.getElementById('regEmail').value.trim(),
          class: !isGV ? document.getElementById('regClass').value.trim() : '',
          dept: isGV ? document.getElementById('regClass').value.trim() : '',
        });

        btn.textContent = 'Tạo tài khoản';
        btn.disabled = false;

        if (!result.success) {
          showMsg('regMsg', false, '✗ ' + result.message);
          return;
        }

        showMsg('regMsg', true, '✓ Tạo tài khoản thành công! Đang chuyển đến trang đăng nhập...');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      }, 800);
    }
  </script>
</body>
</html>
